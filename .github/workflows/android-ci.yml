name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # cho phép bấm chạy tay từ tab Actions trên GitHub khi cần

# Nếu push nhiều lần liên tiếp lên cùng 1 nhánh, huỷ job cũ đang chạy dở
# để tiết kiệm phút CI, chỉ giữ lại lần chạy mới nhất
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Chạy toàn bộ unit test trên JVM (nhanh, không cần Android SDK)
  # Đây là nơi ParseHtmlRaceTest và các test tương tự chạy —
  # tách riêng job này để có kết quả nhanh trong vài phút,
  # không phải đợi build Android xong mới biết test fail hay không.
  # ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Chạy jvmTest cho TẤT CẢ module KMP (content-parser-core, novel-parsers,
      # manga-parsers, shared) trong 1 lệnh, không chỉ định --tests cụ thể
      # như lúc test tay, để bắt được test fail ở bất kỳ module nào
      - name: Run JVM unit tests
        run: ./gradlew allTests --continue --no-daemon
        # --continue: chạy hết tất cả test dù có cái fail giữa chừng,
        # để 1 lần CI thấy được toàn bộ lỗi thay vì dừng ở lỗi đầu tiên

      # Luôn upload báo cáo test (kể cả khi fail) để xem chi tiết trên GitHub,
      # không phải đọc log console dài dòng
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

      # Hiển thị tóm tắt test ngay trên tab Summary của GitHub Actions,
      # không cần mở file HTML tải về
      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JVM Test Results
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

  # ─────────────────────────────────────────────────────────
  # JOB 2: Build APK Android (chỉ chạy nếu JOB 1 pass)
  # Không cần chờ nếu unit test đã fail — tiết kiệm thời gian CI,
  # vì build Android tốn nhiều phút hơn hẳn so với chạy unit test.
  # ─────────────────────────────────────────────────────────
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: unit-tests # chỉ chạy nếu unit-tests thành công
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build bản Debug trên CI — không cần keystore thật, Gradle tự dùng
      # debug keystore mặc định, phù hợp để kiểm tra "code có build được không"
      # mà không phải quản lý secret keystore trên CI (việc đó để riêng khi
      # thật sự cần publish, xem ghi chú signing bên dưới)
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TitReader-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # JOB 3 (tuỳ chọn): Build & ký bản Release — CHỈ chạy khi tạo tag/release,
  # không chạy mỗi lần push thường, vì cần dùng keystore thật lưu trong
  # GitHub Secrets (không commit file .jks vào repo)
  # ─────────────────────────────────────────────────────────
  android-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    needs: unit-tests
    if: startsWith(github.ref, 'refs/tags/v') # chỉ chạy khi push tag dạng v1.0.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Giải mã keystore từ GitHub Secrets (lưu dạng base64) ra file thật
      # trên máy CI tạm thời — không bao giờ commit file .jks vào git
      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build signed release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --verbose \
            androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TitReader-release-${{ github.ref_name }}
          path: androidApp/build/outputs/apk/release/*.apk

      # Xoá file keystore ngay sau khi dùng xong, dù runner sẽ tự huỷ,
      # thói quen tốt để không để lộ file nhạy cảm lâu hơn cần thiết
      - name: Clean up keystore
        if: always()
        run: rm -f release.jks
